blueprint:
  name: "Occupancy-based lighting"
  description: >-
    Simple occupancy-based lighting control with optional door handling,
    turn-on conditions, and turn-off blockers.
  domain: automation
  author: nokside
  source_url: https://raw.githubusercontent.com/nokside/ha-toolbox/main/blueprints/automation/occupancy_based_lighting.yaml

  homeassistant:
    min_version: 2026.7.0

  input:
    light_targets:
      name: Lights
      selector:
        target:
          entity:
            domain: light

    occupancy_targets:
      name: Occupancy
      selector:
        target:
          entity:
            domain: binary_sensor
            device_class: occupancy

    off_delay:
      name: Off delay
      description: >-
        Time to wait before turning off the lights after all occupancy sensors clear.
      default:
        minutes: 1
      selector:
        duration:

    optional_settings:
      name: Optional settings
      icon: mdi:cog
      collapsed: true
      input:

        door_targets:
          name: Doors
          description: >-
            Doors can turn on the lights and trigger turn-off checks, while turn-off
            remains based on occupancy.
          default: {}
          selector:
            target:
              entity:
                domain: binary_sensor
                device_class: door

        turn_on_conditions:
          name: Turn-on conditions
          description: >-
            Conditions that must be met for occupancy or a door to turn on the
            lights. Leave empty or disable to allow turn-on without conditions.
          default:
            - condition: sun
              after: sunset
              after_offset: "-00:30:00"
              before: sunrise
              before_offset: "00:30:00"
              enabled: false
          selector:
            condition:

        turn_off_blockers:
          name: Turn-off blockers
          description: >-
            Keep the lights on while any selected entity is on. Turn-off continues
            automatically when no blockers remain.
          default: []
          selector:
            entity:
              multiple: true

mode: queued

trigger_variables:
  door_targets: !input door_targets
  turn_off_blockers: !input turn_off_blockers

triggers:

- alias: Occupancy detected
  trigger: occupancy.detected
  id: "on"
  target: !input occupancy_targets
  options:
    behavior: first

- alias: Occupancy cleared
  trigger: occupancy.cleared
  id: "off"
  target: !input occupancy_targets
  options:
    behavior: all
    for: !input off_delay

- alias: Door opened
  trigger: door.opened
  id: "on"
  target: !input door_targets
  options:
    behavior: each
  enabled: "{{ door_targets != {} }}"

- alias: Door left open
  trigger: door.opened
  id: "off"
  target: !input door_targets
  options:
    behavior: each
    for: !input off_delay
  enabled: "{{ door_targets != {} }}"

- alias: Door closed
  trigger: door.closed
  id: "off"
  target: !input door_targets
  options:
    behavior: each
  enabled: "{{ door_targets != {} }}"

- alias: Turn-off blocker cleared
  trigger: state
  id: "off"
  entity_id: !input turn_off_blockers
  to: "off"
  enabled: "{{ turn_off_blockers != [] }}"

actions:
- alias: Check if action is required
  condition: or
  conditions:
  - alias: Turn-on conditions
    condition: and
    conditions:
    - condition: trigger
      id: "on"

    - condition: light.is_off
      target: !input light_targets
      options:
        behavior: any

    - condition: !input turn_on_conditions

  - alias: Turn-off conditions
    condition: and
    conditions:
    - condition: trigger
      id: "off"

    - condition: occupancy.is_not_detected
      target: !input occupancy_targets
      options:
        behavior: all
        for: !input off_delay

    - alias: Check turn-off blockers
      condition: template
      value_template: >-
        {{
          turn_off_blockers
            | select('is_state', 'on')
            | first is undefined
        }}

    - condition: light.is_on
      target: !input light_targets
      options:
        behavior: any

- alias: Set light state
  action: "light.turn_{{ trigger.id }}"
  target: !input light_targets
