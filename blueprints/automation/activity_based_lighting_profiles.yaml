blueprint:
  name: "Activity-based lighting + profiles"
  description: |-

    🚶 **Activity**
    Control lights based on activity with support for door sensors, transitions, and idle lighting.

    🎨 **Profiles**
    Use **Time-based profiles** to schedule lighting, and **State-based profiles** for state-driven overrides.

    🛡️ **Control**
    Manage behavior with turn-on conditions, turn-off blockers, and additional failsafes.

    🧩 **Flexible setup**
    Add as many profiles, blockers, and conditions as needed without fixed configuration slots.

  domain: automation
  author: nokside
  source_url: >-
    https://raw.githubusercontent.com/nokside/ha-toolbox/main/blueprints/automation/activity_based_lighting_profiles.yaml

  homeassistant:
    min_version: 2026.1.0

  input:

    light_entities:
      name: Lights
      selector:
        entity:
          filter:
            - domain: light
          multiple: true

    activity_entities:
      name: Activity sensors
      description: Occupancy and motion sensors.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: occupancy
            - domain: binary_sensor
              device_class: motion
          multiple: true

    activity_delay:
      name: Activity delay
      description: Time without activity before applying Idle lighting or turning off the lights.
      default:
        minutes: 1
      selector:
        duration:

    transitions_section:
      name: Transitions
      icon: mdi:transition
      collapsed: true
      input:

        turn_on_transition:
          name: Turn-on transition
          default:
            active_choice: Disabled
            Enabled: 1
          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Enabled:
                  selector:
                    number:
                      min: 0
                      max: 300
                      step: 0.1
                      unit_of_measurement: s

        turn_off_transition:
          name: Turn-off transition
          default:
            active_choice: Disabled
            Enabled: 0
          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Enabled:
                  selector:
                    number:
                      min: 0
                      max: 300
                      step: 0.1
                      unit_of_measurement: s

    lighting_settings_section:
      name: Lighting settings
      icon: mdi:lightbulb-on
      description: Used when Time-based profiles are disabled. State-based profiles can override these settings.
      collapsed: true
      input:

        lighting_brightness:
          name: Brightness
          default:
            active_choice: Disabled
            Enabled: 100
          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Enabled:
                  selector:
                    number:
                      min: 1
                      max: 100
                      step: 1
                      unit_of_measurement: "%"
                      mode: slider

        lighting_color:
          name: Color
          description: |-
            RGBW and RGBWW values as a list:
            ```yaml
            - 255
            - 255
            - 255
            - 255
            # - 255 (for RGBWW)
            ```
          default:
            active_choice: Disabled
            Temperature: 4000
            RGB:
              - 255
              - 255
              - 255
            RGBW:
              - 255
              - 255
              - 255
              - 255
            RGBWW:
              - 255
              - 255
              - 255
              - 255
              - 255
          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Temperature:
                  selector:
                    number:
                      min: 2000
                      max: 6500
                      step: 5
                      unit_of_measurement: "kelvin"
                RGB:
                  selector:
                    color_rgb:
                RGBW:
                  selector:
                    object:
                RGBWW:
                  selector:
                    object:

    time_based_profiles_section:
      name: Time-based profiles
      icon: mdi:clock-outline
      collapsed: true
      input:

        time_based_profiles:
          name: " "
          description: |-
            **[Schedule](https://www.home-assistant.io/integrations/schedule/)** supports the following parameters in **Additional data**:

            - `brightness`
            - `brightness_pct`
            - `color_name`
            - `color_temp_kelvin`
            - `rgb_color` — `R,G,B` (`255,100,0`)
            - `rgbw_color` — `R,G,B,W` (`255,100,0,128`)
            - `rgbww_color` — `R,G,B,CW,WW` (`255,100,0,128,64`)
            - `white`
            - `effect`
            - `profile`

            ---

            ***Custom:***
            *RGBW* and *RGBWW* values as a list:
            ```yaml
            - 255
            - 255
            - 255
            - 128
            # - 128 (for RGBWW)
            ```
            *Entity:* Supports `input_datetime` with a time; date-only entities are skipped.
          default:
            active_choice: Disabled
            Custom:
              - name: Sunrise
                days:
                  active_choice: All days
                after:
                  active_choice: Sunrise
                  Sunrise:
                    minutes: 0
                brightness:
                  active_choice: Enabled
                  Enabled: 50
                color:
                  active_choice: Temperature
                  Temperature: 2700
                  RGB:
                    - 255
                    - 255
                    - 255
                  RGBW:
                    - 255
                    - 255
                    - 255
                    - 255
                  RGBWW:
                    - 255
                    - 255
                    - 255
                    - 255
                    - 255

              - name: Daytime
                days:
                  active_choice: All days
                after:
                  active_choice: Sunrise
                  Sunrise:
                    hours: 2
                brightness:
                  active_choice: Enabled
                  Enabled: 100
                color:
                  active_choice: Temperature
                  Temperature: 4100
                  RGB:
                    - 255
                    - 255
                    - 255
                  RGBW:
                    - 255
                    - 255
                    - 255
                    - 255
                  RGBWW:
                    - 255
                    - 255
                    - 255
                    - 255
                    - 255

              - name: Sunset
                days:
                  active_choice: All days
                after:
                  active_choice: Sunset
                  Sunset:
                    minutes: 0
                brightness:
                  active_choice: Enabled
                  Enabled: 70
                color:
                  active_choice: Temperature
                  Temperature: 3000
                  RGB:
                    - 255
                    - 255
                    - 255
                  RGBW:
                    - 255
                    - 255
                    - 255
                    - 255
                  RGBWW:
                    - 255
                    - 255
                    - 255
                    - 255
                    - 255

              - name: Night
                days:
                  active_choice: All days
                after:
                  active_choice: Time
                  Time: "23:00:00"
                brightness:
                  active_choice: Enabled
                  Enabled: 20
                color:
                  active_choice: Temperature
                  Temperature: 2200
                  RGB:
                    - 255
                    - 255
                    - 255
                  RGBW:
                    - 255
                    - 255
                    - 255
                    - 255
                  RGBWW:
                    - 255
                    - 255
                    - 255
                    - 255
                    - 255

          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Custom:
                  selector:
                    object:
                      multiple: true
                      label_field: name
                      fields:

                        name:
                          label: Name
                          required: true
                          selector:
                            text:

                        days:
                          label: Days of the week
                          selector:
                            choose:
                              choices:
                                All days:
                                  selector:
                                    constant:
                                      value: ""
                                Custom:
                                  selector:
                                    select:
                                      options:
                                        - label: Monday
                                          value: "0"
                                        - label: Tuesday
                                          value: "1"
                                        - label: Wednesday
                                          value: "2"
                                        - label: Thursday
                                          value: "3"
                                        - label: Friday
                                          value: "4"
                                        - label: Saturday
                                          value: "5"
                                        - label: Sunday
                                          value: "6"
                                      multiple: true

                        after:
                          label: After
                          required: true
                          selector:
                            choose:
                              choices:
                                Time:
                                  selector:
                                    time:

                                Entity:
                                  selector:
                                    entity:
                                      filter:
                                        domain: input_datetime

                                Sunrise:
                                  selector:
                                    duration:
                                      allow_negative: true

                                Sunset:
                                  selector:
                                    duration:
                                      allow_negative: true

                        brightness:
                          label: Brightness
                          selector:
                            choose:
                              choices:
                                Disabled:
                                  selector:
                                    constant:
                                      value: ""
                                Enabled:
                                  selector:
                                    number:
                                      min: 1
                                      max: 100
                                      step: 1
                                      unit_of_measurement: "%"
                                      mode: slider

                        color:
                          label: Color
                          selector:
                            choose:
                              choices:
                                Disabled:
                                  selector:
                                    constant:
                                      value: ""
                                Temperature:
                                  selector:
                                    number:
                                      min: 2000
                                      max: 6500
                                      step: 5
                                      unit_of_measurement: "kelvin"
                                RGB:
                                  selector:
                                    color_rgb:
                                RGBW:
                                  selector:
                                    object:
                                RGBWW:
                                  selector:
                                    object:

                Schedule:
                  selector:
                    entity:
                      filter:
                        - domain: schedule

        time_based_dynamic:
          name: Dynamic updates
          description: Dynamically apply the next Time-based profile while activity is detected.
          default: false
          selector:
            boolean:

        time_based_transition:
          name: Transition
          description: Duration to use when applying the next Time-based profile.
          default:
            active_choice: Disabled
            Enabled: 1
          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Enabled:
                  selector:
                    number:
                      min: 0
                      max: 300
                      step: 0.1
                      unit_of_measurement: s

    state_based_profiles_section:
      name: State-based profiles
      icon: mdi:priority-high
      collapsed: true
      input:

        state_based_profiles:
          name: " "
          description: |-
            **Active profiles override Lighting settings and Time-based profiles.
            Order matters. The first matching profile will be applied.**
            *Also, you can use a State-based profile as a bypass activated by an entity state with Brightness and Color Disabled to hand over control while it is active.*

            RGBW and RGBWW values as a list:
            ```yaml
            - 255
            - 255
            - 255
            - 255
            # - 255 (for RGBWW)
            ```
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              fields:

                name:
                  label: Name
                  required: true
                  selector:
                    text:

                entities:
                  label: Entities
                  required: true
                  selector:
                    entity:
                      multiple: true

                states:
                  label: States
                  required: true
                  selector:
                    text:
                      multiple: true

                match:
                  label: Match
                  selector:
                    choose:
                      choices:
                        Any:
                          selector:
                            constant:
                              value: ""
                        All:
                          selector:
                            constant:
                              value: ""

                brightness:
                  label: Brightness
                  selector:
                    choose:
                      choices:
                        Disabled:
                          selector:
                            constant:
                              value: ""
                        Enabled:
                          selector:
                            number:
                              min: 1
                              max: 100
                              step: 1
                              unit_of_measurement: "%"
                              mode: slider

                color:
                  label: Color
                  selector:
                    choose:
                      choices:
                        Disabled:
                          selector:
                            constant:
                              value: ""
                        Temperature:
                          selector:
                            number:
                              min: 2000
                              max: 6500
                              step: 5
                              unit_of_measurement: "kelvin"
                        RGB:
                          selector:
                            color_rgb:
                        RGBW:
                          selector:
                            object:
                        RGBWW:
                          selector:
                            object:

        state_based_transition:
          name: Transition
          description: Duration to use when applying a profile.
          default:
            active_choice: Disabled
            Enabled: 1
          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Enabled:
                  selector:
                    number:
                      min: 0
                      max: 300
                      step: 0.1
                      unit_of_measurement: s

    idle_lighting_section:
      name: Idle lighting
      icon: mdi:motion-sensor-off
      description: >-
        Optional brightness and color applied after the **Activity delay**.
        Lighting settings or Time-based profiles must be configured to restore the lights when activity returns.
      collapsed: true
      input:

        idle_brightness:
          name: Brightness
          default:
            active_choice: Disabled
            Enabled: 10
          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Enabled:
                  selector:
                    number:
                      min: 1
                      max: 100
                      step: 1
                      unit_of_measurement: "%"
                      mode: slider

        idle_color:
          name: Color
          description: |-
            RGBW and RGBWW values as a list:
            ```yaml
            - 255
            - 255
            - 255
            - 255
            # - 255 (for RGBWW)
            ```
          default:
            active_choice: Disabled
            Temperature: 2200
            RGB:
              - 255
              - 255
              - 255
            RGBW:
              - 255
              - 255
              - 255
              - 255
            RGBWW:
              - 255
              - 255
              - 255
              - 255
              - 255
          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Temperature:
                  selector:
                    number:
                      min: 2000
                      max: 6500
                      step: 5
                      unit_of_measurement: "kelvin"
                RGB:
                  selector:
                    color_rgb:
                RGBW:
                  selector:
                    object:
                RGBWW:
                  selector:
                    object:

        idle_transition:
          name: Transition
          default:
            active_choice: Disabled
            Enabled: 1
          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Enabled:
                  selector:
                    number:
                      min: 0
                      max: 300
                      step: 0.1
                      unit_of_measurement: s

        idle_lighting_delay:
          name: Delay
          default:
            minutes: 1
          selector:
            duration:

    turn_on_conditions_section:
      name: Turn-on conditions
      icon: mdi:check-circle-outline
      collapsed: true
      input:

        turn_on_conditions:
          name: " "
          description: Leave empty or keep conditions disabled to allow turn-on at any time.
          default:
            - condition: sun
              after: sunset
              after_offset: "-00:30:00"
              before: sunrise
              before_offset: "00:30:00"
              enabled: false
          selector:
            condition:

    turn_off_blockers_section:
      name: Turn-off blockers
      icon: mdi:shield-lock
      collapsed: true
      input:

        turn_off_blockers:
          name: " "
          description: Prevents Idle lighting or turn-off while a blocker is active.
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              fields:

                name:
                  label: Name
                  required: true
                  selector:
                    text:

                entities:
                  label: Entities
                  required: true
                  selector:
                    entity:
                      multiple: true

                states:
                  label: States
                  required: true
                  selector:
                    text:
                      multiple: true

                match:
                  label: Match
                  selector:
                    choose:
                      choices:
                        Any:
                          selector:
                            constant:
                              value: ""
                        All:
                          selector:
                            constant:
                              value: ""

                when:
                  label: When
                  selector:
                    choose:
                      choices:
                        Before turn-off:
                          selector:
                            constant:
                              value: ""
                        Before idle lighting:
                          selector:
                            constant:
                              value: ""

        idle_blocker_timeout:
          name: Idle lighting blocker timeout
          default:
            active_choice: Disabled
            Enabled:
              hours: 1
          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Enabled:
                  selector:
                    duration:

        turn_off_blocker_timeout:
          name: Turn-off blocker timeout
          default:
            active_choice: Disabled
            Enabled:
              hours: 1
          selector:
            choose:
              choices:
                Disabled:
                  selector:
                    constant:
                      value: ""
                Enabled:
                  selector:
                    duration:

    additional_settings_section:
      name: Additional settings
      icon: mdi:cog
      collapsed: true
      input:

        door_entities:
          name: Door sensors
          description: Optional. Turn on the lights when opened.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class: door
              multiple: true

        turn_off_watchdog:
          name: Turn-off watchdog
          description: |-
            Triggered if lights are on, there is no activity, and the automation is not running.
            Catches lights turned on from any source (manually, remotely, etc.) while the area is inactive.
            Lights will turn off according to your configured delays, blockers, and other settings.

            ⚠️ If enabled while creating the automation, this will not work until Home Assistant is restarted.
            To use it immediately, save the automation first, then enable this option and save again.
          default: false
          selector:
            boolean:

        ha_start:
          name: Home Assistant start
          description: |-
            Triggered when Home Assistant starts if lights are on.
            Lights will turn off according to your configured delays, blockers, and other settings.
          default: false
          selector:
            boolean:

mode: restart

trace:
  stored_traces: 20

trigger_variables:
  door_entities: !input door_entities
  light_entities: !input light_entities
  activity_entities: !input activity_entities

triggers:

  - alias: Activity is detected
    id: "turn_on"
    trigger: template
    value_template: >-
      {{ activity_entities | select('is_state', 'on') | first is defined }}

  - alias: Door opens
    id: "turn_on"
    trigger: state
    entity_id: !input door_entities
    to: "on"
    enabled: "{{ door_entities != [] }}"

  - alias: Turn-off watchdog
    id: "turn_off_watchdog"
    trigger: template
    value_template: >-
      {{
        light_entities | select('is_state', 'on') | first is defined
        and activity_entities | reject('is_state', 'off') | first is undefined
        and is_state_attr(this.entity_id if this else 'none', 'current', 0)
      }}
    enabled: !input turn_off_watchdog

  - alias: Home Assistant start
    trigger: homeassistant
    event: start
    enabled: !input ha_start

variables:
  light_entities: !input light_entities
  activity_entities: !input activity_entities

  turn_on_transition: !input turn_on_transition
  turn_off_transition: !input turn_off_transition

  lighting_brightness: !input lighting_brightness
  lighting_color: !input lighting_color

  state_based_profiles: !input state_based_profiles
  state_based_transition: !input state_based_transition

  time_based_profiles: !input time_based_profiles
  time_based_transition: !input time_based_transition
  time_based_dynamic: !input time_based_dynamic

  idle_brightness: !input idle_brightness
  idle_color: !input idle_color
  idle_transition: !input idle_transition
  idle_lighting_delay: !input idle_lighting_delay

  idle_lighting_enabled: >-
    {{
      idle_brightness.active_choice != 'Disabled'
      or idle_color.active_choice != 'Disabled'
    }}

  turn_off_blockers: !input turn_off_blockers
  idle_blocker_timeout: !input idle_blocker_timeout
  turn_off_blocker_timeout: !input turn_off_blocker_timeout

  color_data_keys:
    Temperature: color_temp_kelvin
    RGB: rgb_color
    RGBW: rgbw_color
    RGBWW: rgbww_color

  schedule_data_keys:
    - brightness
    - brightness_pct
    - color_name
    - color_temp_kelvin
    - rgb_color
    - rgbw_color
    - rgbww_color
    - white
    - effect
    - profile

conditions:

  - alias: Prevent turn-off watchdog self-trigger
    condition: template
    value_template: >-
      {{ trigger.id != 'turn_off_watchdog' or trigger.entity_id != this.entity_id }}

actions:

  - alias: Check if any light is available
    condition: template
    value_template: >-
      {{ light_entities | select('has_value') | first is defined }}

  - alias: Check if any activity sensor is available
    condition: template
    value_template: >-
      {{ activity_entities | select('has_value') | first is defined }}

  - alias: Check light state or turn-on conditions
    condition: or
    conditions:
      - condition: state
        entity_id: !input light_entities
        state: "on"
        match: any

      - condition: and
        conditions:
          - condition: trigger
            id: "turn_on"

          - condition: !input turn_on_conditions

  - alias: If turn-on trigger
    if:
      - condition: trigger
        id: "turn_on"

    then:
      - alias: Track lighting profiles
        repeat:
          sequence:

            - alias: Resolve active profile
              variables:
                profile_state: >-
                  {% set current_time = now() %}
                  {% set light_data = {} %}
                  {% set current_profile = none %}
                  {% set next_event_time = none %}
                  {% set transition = time_based_transition %}
                  {% set profile_type = 'Disabled' %}
                  {% set profile_name = none %}

                  {% if state_based_profiles %}
                    {% set state_based_match = namespace(index=none) %}
                    {% for state_based_profile in state_based_profiles %}
                      {% set profile_matches =
                        state_based_profile.entities
                        and (
                          (state_based_profile.entities
                            | reject('is_state', state_based_profile.states) | first is undefined)
                          if 'match' in state_based_profile
                            and state_based_profile.match.active_choice == 'All'
                          else (state_based_profile.entities
                            | select('is_state', state_based_profile.states) | first is defined)
                        )
                      %}

                      {% if profile_matches %}
                        {% set state_based_match.index = loop.index0 %}
                        {% break %}
                      {% endif %}
                    {% endfor %}
                  {% endif %}

                  {% if state_based_profiles and state_based_match.index is not none %}
                    {% set current_profile = state_based_profiles[state_based_match.index] %}
                    {% set profile_type = 'State-based' %}
                    {% set profile_name =
                      current_profile.name if 'name' in current_profile else none
                    %}
                    {% set transition = state_based_transition %}

                  {% elif time_based_profiles.active_choice == 'Schedule' %}
                    {% set profile_type = 'Schedule' %}
                    {% if is_state(time_based_profiles.Schedule, 'on') %}
                      {% set attrs = states[time_based_profiles.Schedule].attributes %}
                      {% set light_data =
                        dict(attrs.items() | selectattr('0', 'in', schedule_data_keys))
                      %}
                      {% set color_keys_to_parse = ['rgb_color', 'rgbw_color', 'rgbww_color'] %}
                      {% set key_to_parse = color_keys_to_parse | select('in', attrs) | first | default(none) %}

                      {% if key_to_parse is not none %}
                        {% set light_data = combine(
                          light_data,
                          {key_to_parse: attrs[key_to_parse].split(',') | map('trim') | map('int') | list}
                        ) %}
                      {% endif %}
                    {% endif %}

                    {% set next_event_time = state_attr(time_based_profiles.Schedule, 'next_event') %}

                  {% elif time_based_profiles.active_choice == 'Custom' %}
                    {% set profile_type = 'Custom' %}

                    {% macro resolve_profile_timing(profile, current_time, returns) %}
                      {% set start_mode = profile.after.active_choice %}

                      {% if 'days' in profile and profile.days.active_choice == 'Custom' %}
                        {% set weekdays = profile.days.Custom | map('int') | list %}
                      {% else %}
                        {% set weekdays = range(7) | list %}
                      {% endif %}

                      {% set start_time = none %}
                      {% set previous_start = none %}
                      {% set next_start = none %}
                      {% set next_sun_start = none %}

                      {% if start_mode == 'Entity' %}
                        {% set entity = profile.after.Entity %}

                        {% if state_attr(entity, 'has_time') %}
                          {% if state_attr(entity, 'has_date') %}
                            {% set entity_start = as_local(as_datetime(states(entity))) %}

                            {% if entity_start.weekday() in weekdays %}
                              {% if entity_start <= current_time %}
                                {% set previous_start = entity_start %}
                              {% else %}
                                {% set next_start = entity_start %}
                              {% endif %}
                            {% endif %}

                          {% else %}
                            {% set start_time = today_at(states(entity)) %}
                          {% endif %}
                        {% endif %}

                      {% elif start_mode in ['Sunrise', 'Sunset'] %}
                        {% set event = 'next_rising' if start_mode == 'Sunrise' else 'next_setting' %}
                        {% set next_sun = as_local(as_datetime(state_attr('sun.sun', event))) %}

                        {% if next_sun.date() > current_time.date() %}
                          {% set event_time = next_sun - timedelta(days=1) %}
                          {% if event_time > current_time %}
                            {% set event_time = current_time %}
                          {% endif %}
                        {% else %}
                          {% set event_time = next_sun %}
                        {% endif %}

                        {% set offset = timedelta(**profile.after[start_mode]) %}
                        {% set start_time = event_time + offset %}
                        {% set next_sun_start = next_sun + offset %}

                      {% else %}
                        {% set start_time = today_at(profile.after.Time) %}
                      {% endif %}

                      {% if start_time is not none %}
                        {% set day_shift = (current_time.date() - start_time.date()).days %}
                        {% set start_base = start_time + timedelta(days=day_shift) %}
                        {% set previous_base =
                          start_base if start_base <= current_time else start_base - timedelta(days=1)
                        %}
                        {% set next_base = previous_base + timedelta(days=1) %}

                        {% set previous_weekday = previous_base.weekday() %}
                        {% set next_weekday = next_base.weekday() %}

                        {% set previous_weekdays = weekdays | select('le', previous_weekday) | list %}
                        {% set previous_day =
                          previous_weekdays | max if previous_weekdays else weekdays | max
                        %}

                        {% set next_weekdays = weekdays | select('ge', next_weekday) | list %}
                        {% set next_day = next_weekdays | min if next_weekdays else weekdays | min %}

                        {% set previous_start =
                          previous_base - timedelta(days=(previous_weekday - previous_day) % 7)
                        %}
                        {% set next_start =
                          next_base + timedelta(days=(next_day - next_weekday) % 7)
                        %}

                        {% if next_sun_start is not none %}
                          {% if
                            next_sun_start <= current_time
                            and next_sun_start.date() == previous_start.date()
                          %}
                            {% set previous_start = next_sun_start %}
                          {% elif
                            next_sun_start > current_time
                            and next_sun_start.date() == next_start.date()
                          %}
                            {% set next_start = next_sun_start %}
                          {% endif %}
                        {% endif %}
                      {% endif %}

                      {% do returns({
                        'profile': profile,
                        'previous_start': previous_start,
                        'next_start': next_start
                      }) %}
                    {% endmacro %}

                    {% set resolve_timing = resolve_profile_timing | as_function %}
                    {% set profile_timings =
                      time_based_profiles.Custom | map('apply', resolve_timing, current_time) | list
                    %}

                    {% set current_timing =
                      profile_timings | rejectattr('previous_start', 'none')
                        | max(attribute='previous_start') | default(none)
                    %}
                    {% set next_timing =
                      profile_timings | rejectattr('next_start', 'none')
                        | min(attribute='next_start') | default(none)
                    %}

                    {% set current_profile =
                      current_timing.profile if current_timing is not none else none
                    %}
                    {% if current_profile is not none and 'name' in current_profile %}
                      {% set profile_name = current_profile.name %}
                    {% endif %}
                    {% set next_event_time =
                      next_timing.next_start if next_timing is not none else none
                    %}

                  {% elif time_based_profiles.active_choice == 'Disabled' %}
                    {% set profile_type = 'Lighting' %}
                    {% set current_profile = {'brightness': lighting_brightness, 'color': lighting_color} %}
                    {% set transition = {'active_choice': 'Disabled'} %}
                  {% endif %}

                  {% if current_profile is not none %}
                    {% set brightness =
                      current_profile.brightness if 'brightness' in current_profile else none
                    %}
                    {% set color = current_profile.color if 'color' in current_profile else none %}
                    {% set color_mode = color.active_choice if color is not none else none %}
                    {% set light_data =
                      combine(
                        {'brightness_pct': brightness.Enabled}
                          if brightness is not none and brightness.active_choice == 'Enabled' else {},
                        {color_data_keys[color_mode]: color[color_mode]}
                          if color is not none and color_mode in color_data_keys else {}
                      )
                    %}
                  {% endif %}

                  {% set light_data = combine(
                    light_data,
                    {'transition': turn_on_transition.Enabled}
                      if repeat.first and turn_on_transition.active_choice == 'Enabled'
                      else {'transition': transition.Enabled}
                        if not repeat.first and transition.active_choice == 'Enabled' and light_data
                        else {}
                  ) %}

                  {% if time_based_dynamic and next_event_time is not none %}
                    {% set profile_wait_timeout = {
                      'seconds': as_timestamp(next_event_time) - as_timestamp(current_time)
                    } %}
                  {% elif state_based_profiles %}
                    {% set profile_wait_timeout = {'days': 999} %}
                  {% else %}
                    {% set profile_wait_timeout = none %}
                  {% endif %}

                  {% set result = {'type': profile_type} %}

                  {% if profile_name is not none %}
                    {% set result = combine(result, {'name': profile_name}) %}
                  {% endif %}

                  {% set result = combine(result, {
                    'light_data': light_data,
                    'profile_wait_timeout': profile_wait_timeout
                  }) %}

                  {% if state_based_profiles %}
                    {% set result = combine(result, {'state_based_index': state_based_match.index}) %}
                  {% endif %}

                  {{ result }}

            - alias: If light.turn_on should be performed
              if:
                - condition: or
                  conditions:
                    - condition: template
                      value_template: "{{ repeat.first }}"

                    - condition: state
                      entity_id: !input light_entities
                      state: "on"
                      match: any

              then:
                - action: light.turn_on
                  target:
                    entity_id: !input light_entities
                  data: "{{ profile_state.light_data }}"

            - alias: Check if profile can change
              condition: template
              value_template: "{{ profile_state.profile_wait_timeout is not none }}"

            - alias: Wait until profile changes or no activity
              wait_template: >-
                {% set activity_cleared =
                  activity_entities | select('is_state', 'on') | first is undefined
                %}
                {% set state_based_changed = false %}

                {% if not activity_cleared and state_based_profiles %}
                  {% set state_based_match = namespace(index=none) %}
                  {% for state_based_profile in state_based_profiles %}
                    {% set profile_matches =
                      state_based_profile.entities
                      and (
                        (state_based_profile.entities
                          | reject('is_state', state_based_profile.states) | first is undefined)
                        if 'match' in state_based_profile
                          and state_based_profile.match.active_choice == 'All'
                        else (state_based_profile.entities
                          | select('is_state', state_based_profile.states) | first is defined)
                      )
                    %}

                    {% if profile_matches %}
                      {% set state_based_match.index = loop.index0 %}
                      {% break %}
                    {% endif %}
                  {% endfor %}

                  {% set state_based_changed =
                    state_based_match.index != profile_state.state_based_index
                  %}
                {% endif %}

                {{ activity_cleared or state_based_changed }}
              timeout: "{{ profile_state.profile_wait_timeout }}"
              continue_on_timeout: true

          until:
            - alias: Until no activity or profile cannot change
              condition: template
              value_template: >-
                {{
                  activity_entities | select('is_state', 'on') | first is undefined
                  or profile_state.profile_wait_timeout is none
                }}

  - alias: Wait until no activity
    wait_template: >-
      {{ activity_entities | select('is_state', 'on') | first is undefined }}

  - alias: Check if any light is on
    condition: state
    entity_id: !input light_entities
    state: "on"
    match: any

  - alias: Activity delay
    delay: !input activity_delay

  - alias: Wait for blockers before idle lighting
    wait_template: >-
      {% set blocker_state = namespace(active=false) %}

      {% for blocker in turn_off_blockers %}
        {% if 'when' in blocker and blocker.when.active_choice == 'Before idle lighting' %}
          {% set blocker_matches =
            blocker.entities
            and (
              (blocker.entities | reject('is_state', blocker.states) | first is undefined)
              if 'match' in blocker and blocker.match.active_choice == 'All'
              else (blocker.entities | select('is_state', blocker.states) | first is defined)
            )
          %}

          {% if blocker_matches %}
            {% set blocker_state.active = true %}
            {% break %}
          {% endif %}
        {% endif %}
      {% endfor %}

      {{
        not idle_lighting_enabled
        or light_entities | select('is_state', 'on') | first is undefined
        or not blocker_state.active
      }}

    timeout: >-
      {{
        idle_blocker_timeout.Enabled
          if idle_blocker_timeout.active_choice == 'Enabled' else {'days': 999}
      }}

  - alias: If idle lighting is enabled
    if:
      - condition: template
        value_template: "{{ idle_lighting_enabled }}"

      - alias: Check if any light is on
        condition: state
        entity_id: !input light_entities
        state: "on"
        match: any

    then:
      - action: light.turn_on
        target:
          entity_id: !input light_entities
        data: >-
          {% set color_mode = idle_color.active_choice %}

          {{
            combine(
              {'transition': idle_transition.Enabled}
                if idle_transition.active_choice == 'Enabled' else {},
              {'brightness_pct': idle_brightness.Enabled}
                if idle_brightness.active_choice == 'Enabled' else {},
              {color_data_keys[color_mode]: idle_color[color_mode]} if color_mode in color_data_keys else {}
            )
          }}

      - alias: Idle lighting delay
        delay: !input idle_lighting_delay

  - alias: Wait for blockers before turn-off
    wait_template: >-
      {% set blocker_state = namespace(active=false) %}

      {% for blocker in turn_off_blockers %}
        {% if 'when' not in blocker or blocker.when.active_choice != 'Before idle lighting' %}
          {% set blocker_matches =
            blocker.entities
            and (
              (blocker.entities | reject('is_state', blocker.states) | first is undefined)
              if 'match' in blocker and blocker.match.active_choice == 'All'
              else (blocker.entities | select('is_state', blocker.states) | first is defined)
            )
          %}

          {% if blocker_matches %}
            {% set blocker_state.active = true %}
            {% break %}
          {% endif %}
        {% endif %}
      {% endfor %}

      {{
        light_entities | select('is_state', 'on') | first is undefined
        or not blocker_state.active
      }}

    timeout: >-
      {{
        turn_off_blocker_timeout.Enabled
          if turn_off_blocker_timeout.active_choice == 'Enabled' else {'days': 999}
      }}

  - alias: Check if any light is on
    condition: state
    entity_id: !input light_entities
    state: "on"
    match: any

  - alias: Turn off lights
    action: light.turn_off
    target:
      entity_id: !input light_entities
    data: >-
      {{
        {'transition': turn_off_transition.Enabled}
          if turn_off_transition.active_choice == 'Enabled' else {}
      }}
