# System: Low batteries
#
# Diagnostic template sensor for Home Assistant.
# Shows battery sensors/devices at or below the configured threshold.
#
# Variables:
# - threshold: low battery threshold in percent.
# - ignore_label: optional Home Assistant label for ignored entities/devices.
# - ignored_entities: optional manual ignore list.
#
# Examples:
# threshold: 30
# ignore_label: "Diagnostics Ignore"
#
# ignored_entities:
#   - sensor.some_device_battery
#   - sensor.old_remote_battery
#
# Optional variables may be left empty.
#
# Dashboard card example:
#
# type: markdown
# title: Low batteries
# content: |
#   {% set sensor = 'sensor.system_low_batteries' %}
#   {% set sensor_state = states(sensor) %}
#   {% set batteries =
#     state_attr(sensor, 'low_batteries') | default([], true)
#   %}
#
#   {% if is_number(sensor_state) %}
#   {% if batteries %}
#   <ha-alert alert-type="warning" title="Low batteries:">
#   {% for item in batteries %}
#   {% set level = 'Low' if item.level == 'low'
#     else ('%g' | format(item.level)) ~ '%' %}
#   {% if item.device_id %}
#   {% set url = '/config/devices/device/' ~ item.device_id %}
#   - [**{{ item.name | e }}**]({{ url }}) — {{ level }}
#   {% else %}
#   - **{{ item.name | e }}** — {{ level }}
#   {% endif %}
#   {% endfor %}
#   </ha-alert>
#   {% else %}
#   ✅ No low batteries
#   {% endif %}
#   {% endif %}

- triggers:
    # Optional: uncomment for immediate update after HA start.
    # - trigger: homeassistant
    #   event: start

    # Optional: uncomment for immediate update after template reload.
    # - trigger: event
    #   event_type: event_template_reloaded

    - trigger: time_pattern
      minutes: "/5"

  sensor:
    - name: "System: Low batteries"
      unique_id: system_low_batteries

      icon: >
        {% if result %}
          mdi:battery-alert-variant-outline
        {% else %}
          mdi:battery-check-outline
        {% endif %}

      variables:
        threshold: 30
        ignore_label: "Diagnostics Ignore"
        ignored_entities:

        result: >
          {% set threshold = threshold | float(30) %}

          {% if ignore_label is string %}
            {% set ignore_label = ignore_label | trim %}
          {% else %}
            {% set ignore_label = '' %}
          {% endif %}

          {% if not ignored_entities %}
            {% set ignored_entity_ids = [] %}
          {% elif ignored_entities is string %}
            {% set ignored_entity_ids =
              ignored_entities.split(',') | map('trim') | reject('eq', '') | list
            %}
          {% else %}
            {% set ignored_entity_ids = ignored_entities | list %}
          {% endif %}

          {% set ignored_device_ids = [] %}

          {% if ignore_label %}
            {% set ignored_entity_ids =
              ignored_entity_ids + label_entities(ignore_label)
            %}
            {% set ignored_device_ids = label_devices(ignore_label) %}
          {% endif %}

          {% set batteries = namespace(
            numeric_devices={},
            numeric_entities=[],
            binary_devices={},
            binary_entities=[]
          ) %}

          {% for battery in states.sensor
            | selectattr('attributes.device_class', 'eq', 'battery')
            | rejectattr('entity_id', 'in', ignored_entity_ids)
            | rejectattr('entity_id', 'is_hidden_entity') %}
          
            {% set level = battery.state | float(-1) %}
          
            {% if 0 <= level <= threshold %}
              {% set battery_device_id = device_id(battery.entity_id) %}
              {% set name =
                device_name(battery.entity_id) or battery.name or battery.entity_id
              %}
              {% set area = area_name(battery.entity_id) %}
              {% set display_name =
                name ~ (' (' ~ area ~ ')' if area else '')
              %}

              {% if battery_device_id %}
                {% if battery_device_id not in ignored_device_ids %}
                  {% set current =
                    batteries.numeric_devices.get(battery_device_id)
                  %}

                  {% if current is none or level < current.level %}
                    {% set batteries.numeric_devices =
                      batteries.numeric_devices | combine({
                        battery_device_id: {
                          'entity_id': battery.entity_id,
                          'device_id': battery_device_id,
                          'name': display_name | trim,
                          'level': level
                        }
                      })
                    %}
                  {% endif %}
                {% endif %}
              {% else %}
                {% set batteries.numeric_entities =
                  batteries.numeric_entities + [{
                    'entity_id': battery.entity_id,
                    'device_id': none,
                    'name': display_name | trim,
                    'level': level
                  }]
                %}
              {% endif %}
            {% endif %}
          {% endfor %}

          {% for battery in states.binary_sensor
            | selectattr('attributes.device_class', 'eq', 'battery')
            | selectattr('state', 'eq', 'on')
            | rejectattr('entity_id', 'in', ignored_entity_ids)
            | rejectattr('entity_id', 'is_hidden_entity') %}

            {% set battery_device_id = device_id(battery.entity_id) %}
            {% set name =
              device_name(battery.entity_id) or battery.name or battery.entity_id
            %}
            {% set area = area_name(battery.entity_id) %}
            {% set display_name =
              name ~ (' (' ~ area ~ ')' if area else '')
            %}

            {% if battery_device_id %}
              {% if battery_device_id not in ignored_device_ids
                and battery_device_id not in batteries.numeric_devices
                and battery_device_id not in batteries.binary_devices %}

                {% set batteries.binary_devices =
                  batteries.binary_devices | combine({
                    battery_device_id: {
                      'entity_id': battery.entity_id,
                      'device_id': battery_device_id,
                      'name': display_name | trim,
                      'level': 'low'
                    }
                  })
                %}
              {% endif %}
            {% else %}
              {% set batteries.binary_entities =
                batteries.binary_entities + [{
                  'entity_id': battery.entity_id,
                  'device_id': none,
                  'name': display_name | trim,
                  'level': 'low'
                }]
              %}
            {% endif %}
          {% endfor %}

          {% set numeric =
            (batteries.numeric_devices.values() | list)
            + batteries.numeric_entities
          %}
          {% set binary =
            (batteries.binary_devices.values() | list)
            + batteries.binary_entities
          %}

          {{
            (numeric | sort(attribute='level'))
            + (binary | sort(attribute='name'))
          }}

      state: "{{ result | count }}"

      attributes:
        low_batteries: "{{ result }}"
